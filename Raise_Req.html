<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Membership Request - Open Community Library</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header img {
      height: 60px;
    }
    nav {
      display: flex;
      gap: 30px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      position: relative;
      padding: 5px 0;
      transition: color 0.3s ease;
    }
    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      background: #4CAF50;
      left: 0;
      bottom: 0;
      transition: width 0.3s ease;
    }
    nav a:hover {
      color: #4CAF50;
    }
    nav a:hover::after {
      width: 100%;
    }
    main {
      padding: 40px 50px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2e7d32;
    }
    /* Membership Form Styles */
    .request-form {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }
    .request-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2e7d32;
    }
    .request-form label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .request-form input,
    .request-form select {
      width: 100%;
      padding: 10px 15px;
      margin-bottom: 20px;
      border: 2px solid #ddd;
      border-radius: 25px;
      transition: border-color 0.3s ease;
    }
    .request-form input:focus,
    .request-form select:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .request-form button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .request-form button:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>

  <header>
  <img src="logo.png" alt="Library Logo">
  <nav>
    <a href="Member_Dashboard.html">Dashboard</a>
    <a href="index.html">Logout</a>
  </nav>
</header>

  <main>
    <h1>Membership Request</h1>

    <!-- Membership Request Form -->
    <div class="request-form">
      <h2>Apply for Membership</h2>
      <form id="membershipRequestForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter Full Name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter Email Address" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter Phone Number" required>

        <label for="membershipType">Membership Type</label>
        <select id="membershipType" required>
          <option value="">Select Membership Type</option>
          <option value="standard">Standard</option>
          <option value="premium">Premium</option>
        </select>

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Enter Address" required>

        <label for="proof">Identity Proof Number</label>
        <input type="text" id="proof" placeholder="Enter Identity Proof Number" required>

        <button type="submit">Submit Request</button>
      </form>
    </div>

  </main>

  <script>
    // Form submission handling
    document.getElementById("membershipRequestForm").addEventListener("submit", function(event){
      event.preventDefault();
      alert("Membership Request Submitted Successfully!");
      // Here you can add actual submission logic (e.g., API call)
    });
  </script>

</body>
</html>
