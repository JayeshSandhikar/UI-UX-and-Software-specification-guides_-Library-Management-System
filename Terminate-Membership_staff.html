<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terminate Membership - Staff Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      color: #333;
    }

    /* Topbar styles */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #2c3e50;
      padding: 10px 20px;
      color: white;
    }

    .topbar img {
      height: 40px;
    }

    .topbar-buttons {
      display: flex;
      gap: 15px;
    }

    .topbar-buttons a {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      background-color: #34495e;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .topbar-buttons a:hover {
      background-color: #1a252f;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 60%;
      padding: 12px;
      border: 2px solid #2c3e50;
      border-radius: 8px;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .terminate-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .terminate-btn:hover {
      background-color: #c82333;
    }

    .step {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    .step input {
      padding: 10px;
      width: 80%;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .step button {
      padding: 10px 20px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .step button:hover {
      background-color: #1a252f;
    }

    .step.active {
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .search-bar input {
        width: 100%;
      }

      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .topbar-buttons {
        margin-top: 10px;
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="topbar">
    <img src="logo.png" alt="Library Logo" />
    <div class="topbar-buttons">
      <a href="Staff_Dashboard.html">Dashboard</a>
      <a href="login.html">Logout</a>
    </div>
  </div>

  <div class="container">
    <h1>Terminate Membership</h1>

    <div class="search-bar">
      <input type="text" placeholder="Search by ID..." />
    </div>

    <div class="cards">
      <div class="card">Member Name: Alice Johnson</div>
      <div class="card">Membership ID: MEM001</div>
      <div class="card">Total Books Issued: 3</div>
      <div class="card">Membership Status: Active</div>
      <div class="card">Pending Dues: None</div>
    </div>

    <button class="terminate-btn" onclick="showStep('step1')">Terminate Membership</button>

    <!-- Step 1: Enter Mobile Number -->
    <div id="step1" class="step">
      <h3>Enter Mobile Number</h3>
      <input type="text" placeholder="Enter Mobile Number" />
      <br />
      <button onclick="showStep('step2')">Send OTP</button>
    </div>

    <!-- Step 2: Enter OTP -->
    <div id="step2" class="step">
      <h3>Enter OTP</h3>
      <input type="text" placeholder="Enter OTP" />
      <br />
      <button onclick="showStep('step3')">Verify OTP</button>
    </div>

    <!-- Step 3: Confirmation -->
    <div id="step3" class="step">
      <h3>Confirm Termination</h3>
      <button onclick="confirmTermination()">Confirm Terminate</button>
    </div>
  </div>

  <script>
    function showStep(stepId) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    function confirmTermination() {
      alert('Membership Terminated Successfully!');
      location.reload();
    }
  </script>

</body>
</html>
