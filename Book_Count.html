<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Count - Staff Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      color: #333;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .header img {
      height: 50px;
    }

    .header .buttons {
      display: flex;
      gap: 20px;
    }

    .header .buttons a {
      color: #2c3e50; /* Text color */
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .header .buttons a:hover {
      background-color: #f1f7fd;
    }

    .container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: #2c3e50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .back-button:hover {
      background-color: #1a252f;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .search-bar input {
      width: 60%;
      padding: 12px 20px;
      border: 2px solid #ccc;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-bar input:focus {
      border-color: #2c3e50;
    }

    .cards {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .left-cards, .right-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .card {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
      color: #27ae60;
    }

    @media (max-width: 768px) {
      .cards {
        flex-direction: column;
      }

      .search-bar input {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- Header without colored bar -->
  <header class="header">
    <img src="logo.png" alt="Logo"> <!-- Add your logo here -->
    <div class="buttons">
      <a href="Staff_Dashboard.html">Dashboard</a>
      <a href="login.html"  >Logout</a>
    </div>
  </header>

  <!-- Content Section -->
  <div class="container">
   
    <h1>Book Count Overview</h1>

    <div class="search-bar">
      <input type="text" placeholder="Search by name / ID / genre" />
    </div>

    <div class="cards">
      <div class="left-cards">
        <div class="card">
          <h3>Total Books Available</h3>
          <p>1200</p>
        </div>
        <div class="card">
          <h3>Total Books Issued</h3>
          <p>350</p>
        </div>
        <div class="card">
          <h3>Books in Waiting</h3>
          <p>75</p>
        </div>
      </div>

      <div class="right-cards">
        <div class="card">
          <h3>Total Open Requests</h3>
          <p>40</p>
        </div>
        <div class="card">
          <h3>Total Closed Requests</h3>
          <p>150</p>
        </div>
        <div class="card">
          <h3>Total Members</h3>
          <p>300</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
