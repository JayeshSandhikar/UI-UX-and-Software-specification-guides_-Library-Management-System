<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expired Allowed Time - Staff Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      color: #333;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .header img {
      height: 50px;
    }

    .header .buttons {
      display: flex;
      gap: 20px;
    }

    .header .buttons a {
      color: #2c3e50; /* Text color */
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .header .buttons a:hover {
      background-color: #f1f7fd;
    }

    .container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: #2c3e50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .back-button:hover {
      background-color: #1a252f;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .action-button {
      padding: 8px 16px;
      margin: 2px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .action-button:hover {
      background-color: #d35400;
    }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      th {
        text-align: left;
      }

      td {
        text-align: right;
        padding-left: 50%;
        position: relative;
      }

      td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        font-weight: bold;
      }
    }
  </style>
</head>
<body>

  <!-- Header without colored bar -->
  <header class="header">
    <img src="logo.png" alt="Logo"> <!-- Add your logo here -->
    <div class="buttons">
      <a href="staff_dashboard.html">Dashboard</a>
      <a href="login.html"  >Logout</a>
    </div>
  </header>

  <!-- Content Section -->
  <div class="container">
    
    <h1>Expired Allowed Time Requests</h1>

    <table>
      <thead>
        <tr>
          <th>Request ID</th>
          <th>Book Name</th>
          <th>User Name</th>
          <th>Expired Date</th>
          <th>Available Count</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-label="Request ID">REQ001</td>
          <td data-label="Book Name">Data Structures</td>
          <td data-label="User Name">John Doe</td>
          <td data-label="Expired Date">2025-04-05</td>
          <td data-label="Available Count">3</td>
          <td data-label="Action">
            <button class="action-button">Make Alert</button>
          </td>
        </tr>
        <tr>
          <td data-label="Request ID">REQ002</td>
          <td data-label="Book Name">Database Systems</td>
          <td data-label="User Name">Jane Smith</td>
          <td data-label="Expired Date">2025-04-07</td>
          <td data-label="Available Count">2</td>
          <td data-label="Action">
            <button class="action-button">Make Alert</button>
          </td>
        </tr>
        <!-- Add more rows as needed -->
      </tbody>
    </table>
  </div>

</body>
</html>
