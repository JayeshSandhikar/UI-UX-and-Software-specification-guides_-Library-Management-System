<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Open Community Library</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header img {
      height: 60px;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      position: relative;
      padding: 5px 0;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      background: #4CAF50;
      left: 0;
      bottom: 0;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #4CAF50;
    }

    nav a:hover::after {
      width: 100%;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(to right, #e8f5e9, #ffffff);
    }

    .hero h1 {
      font-size: 48px;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #555;
      max-width: 600px;
      margin: 0 auto;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #388e3c;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #fff;
      margin-top: 50px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <img src="Logo.png" alt="Library Logo">
    <nav>
      <a href="index.html">Home</a>
     <a href="Explore.html">Explore</a>
      <a href="Login.html">Login</a>
      <a href="Events.html">Events</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to the Open Community Library</h1>
    <p>Your gateway to knowledge and discovery. Explore thousands of books, attend community events, and much more!</p>
    <a href="#" class="btn">Explore Now</a>
  </section>

  <footer>
    &copy; 2025 Open Community Library. All rights reserved.
  </footer>

</body>
</html>
